<!DOCTYPE html>
<html>
<head>
  <title>Snake 1v1</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      color: white;
      font-family: Arial;
    }
    .container {
      display: flex;
      gap: 30px;
      text-align: center;
    }
    canvas {
      border: 2px solid white;
      background: #111;
    }
  </style>
</head>
<body>

<div class="container">
  <div>
    <h3>You</h3>
    <canvas id="game1" width="400" height="400"></canvas>
    <p id="score1">Score: 0</p>
  </div>

  <div>
    <h3>Opponent</h3>
    <canvas id="game2" width="400" height="400"></canvas>
    <p id="score2">Score: 0</p>
  </div>
</div>

<h1 id="centerText" style="position:absolute;">Waiting...</h1>

<script>
const grid = 16;

const ctx1 = document.getElementById('game1').getContext('2d');
const ctx2 = document.getElementById('game2').getContext('2d');

let players = { me: null, opponent: null };

// 🔥 TWO apples (THIS FIXES YOUR ISSUE)
let appleMe = null;
let appleOpponent = null;

const socket = new WebSocket("ws://localhost:3000");

socket.onopen = () => {
  socket.send(JSON.stringify({ type: "joinQueue" }));
};

socket.onmessage = (event) => {
  const data = JSON.parse(event.data);

  if (data.type === "countdown") {
    document.getElementById("centerText").innerText = data.value;
  }

  if (data.type === "gameState") {
    document.getElementById("centerText").innerText = "Time: " + data.timeLeft;

    players.me = data.me;
    players.opponent = data.opponent;

    // 🔥 IMPORTANT: separate apples
    appleMe = data.apple;
    appleOpponent = data.opponent.apple;

    document.getElementById("score1").innerText = "Score: " + players.me.score;
    document.getElementById("score2").innerText = "Score: " + players.opponent.score;
  }

  if (data.type === "gameOver") {
    if (data.winner === "tie") alert("Draw!");
    else alert(data.winner === "me" ? "You win!" : "You lose!");
  }
};

document.addEventListener('keydown', (e) => {
  socket.send(JSON.stringify({
    type: "input",
    key: e.which
  }));
});

function draw(ctx, snake, color) {
  if (!snake) return;

  ctx.fillStyle = color;
  snake.cells.forEach(cell => {
    ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);
  });
}

function loop() {
  requestAnimationFrame(loop);

  ctx1.clearRect(0,0,400,400);
  ctx2.clearRect(0,0,400,400);

  draw(ctx1, players.me, "lime");
  draw(ctx2, players.opponent, "cyan");

  // 🔥 draw YOUR apple
  if (appleMe) {
    ctx1.fillStyle = "red";
    ctx1.fillRect(appleMe.x, appleMe.y, grid-1, grid-1);
  }

  // 🔥 draw OPPONENT apple
  if (appleOpponent) {
    ctx2.fillStyle = "red";
    ctx2.fillRect(appleOpponent.x, appleOpponent.y, grid-1, grid-1);
  }
}

requestAnimationFrame(loop);
</script>

</body>
</html>
