<!DOCTYPE html>
<html>
<head>
  <title>Snake 1v1</title>

  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: black;
      color: white;

      font-family: Arial;
    }

    .container {
      display: flex;
      gap: 30px;
      text-align: center;
    }

    canvas {
      border: 2px solid white;
      background: #111;
    }

    .timer {
      font-size: 22px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <div>
    <h3>Du</h3>

    <canvas
      id="game1"
      width="400"
      height="400">
    </canvas>

    <p id="score1">Punkte: 0</p>

    <div class="timer">
      
      <span id="timer1">30</span>
    </div>
  </div>

  <div>
    <h3>Gegner</h3>

    <canvas
      id="game2"
      width="400"
      height="400">
    </canvas>

    <p id="score2">Punkte: 0</p>

    <div class="timer">
      
      <span id="timer2">30</span>
    </div>
  </div>

</div>

<h1
  id="centerText"
  style="position:absolute;">
  Warten...
</h1>

<script>
const grid = 16;

const ctx1 =
  document.getElementById('game1')
  .getContext('2d');

const ctx2 =
  document.getElementById('game2')
  .getContext('2d');

let players = {
  me: null,
  opponent: null
};

let appleMe = null;

const socket =
  new WebSocket(

  );


socket.onopen = () => {

  socket.send(JSON.stringify({
    type: "joinQueue"
  }));

};


socket.onmessage = (event) => {

  const data = JSON.parse(event.data);


  if (data.type === "countdown") {

    document.getElementById(
      "centerText"
    ).innerText = data.value;

  }


  if (data.type === "gameState") {

    document.getElementById(
      "centerText"
    ).innerText = "";

    players.me = data.me;
    players.opponent = data.opponent;

    appleMe = data.apple;


    document.getElementById(
      "score1"
    ).innerText =
      "Punkte: " + players.me.score;

    document.getElementById(
      "score2"
    ).innerText =
      "Punkte: " + players.opponent.score;


    document.getElementById(
      "timer1"
    ).innerText = data.myTimeLeft;

    document.getElementById(
      "timer2"
    ).innerText = data.opponentTimeLeft;
  }


  if (data.type === "gameOver") {

    alert(
      data.winner === "me"
        ? "Du hast gewonnen!"
        : "Du hast verloren!"
    );

  }

};


document.addEventListener('keydown', (e) => {

  socket.send(JSON.stringify({
    type: "input",
    key: e.which
  }));

});


function drawSnake(ctx, snake, color) {

  if (!snake) return;

  ctx.fillStyle = color;

  snake.cells.forEach(cell => {

    ctx.fillRect(
      cell.x,
      cell.y,
      grid - 1,
      grid - 1
    );

  });

}


function loop() {

  requestAnimationFrame(loop);

  ctx1.clearRect(0, 0, 400, 400);
  ctx2.clearRect(0, 0, 400, 400);

  drawSnake(ctx1, players.me, "lime");
  drawSnake(ctx2, players.opponent, "cyan");


  if (appleMe) {

    ctx1.fillStyle = "red";

    ctx1.fillRect(
      appleMe.x,
      appleMe.y,
      grid - 1,
      grid - 1
    );

  }

}

requestAnimationFrame(loop);
</script>

</body>
</html>
